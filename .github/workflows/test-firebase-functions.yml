name: Check Firebase Functions
on:
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/test-firebase-functions.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/test-firebase-functions.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Cloud Functions JavaScript and deployment exports
        working-directory: functions
        run: npm run check
