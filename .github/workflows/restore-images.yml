name: Restore images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore
        run: |
          D=app/src/main/res/drawable-nodpi
          echo "=== history of res since Nov 1 ==="
          git log --since=2026-11-01 --name-status --format='--- %h %s' -- app/src/main/res | head -150
          echo "=== restoring files deleted since Nov 2 ==="
          for f in $(git log --since=2026-11-02 --diff-filter=D --name-only --format= -- "$D/" | sort -u); do
            c=$(git log --diff-filter=D --format=%H -n1 -- "$f")
            echo "restore $f from $c^"
            git checkout "$c^" -- "$f" || true
          done
          rm -f $D/*.zip $D/sx_spec_*.png
          ls $D
          git config user.name "restore-bot"
          git config user.email "restore-bot@users.noreply.github.com"
          git add -A $D
          git diff --cached --quiet || (git commit -m "Restore drawable-nodpi images deleted by mistake" && git push)
