name: Restore images
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore
        run: |
          SHA=$(git log --format=%H -n1 --grep='^Delete app/src/main/res/drawable-nodpi directory')
          echo "delete commit: $SHA"
          test -n "$SHA"
          git checkout "$SHA^" -- app/src/main/res/drawable-nodpi
          rm -f app/src/main/res/drawable-nodpi/*.zip app/src/main/res/drawable-nodpi/sx_spec_*.png
          ls app/src/main/res/drawable-nodpi
          git config user.name "restore-bot"
          git config user.email "restore-bot@users.noreply.github.com"
          git add -A app/src/main/res/drawable-nodpi
          git commit -m "Restore drawable-nodpi images deleted by mistake"
          git push
