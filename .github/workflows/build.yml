name: Build APK
on: workflow_dispatch
env:
  KS_PASS: sehatiKeystore2026
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: app/sehati.keystore
          key: sehati-keystore-v1
      - name: Use signing key from secret
        if: env.KS_B64 != ''
        run: echo "$KS_B64" | base64 -d > app/sehati.keystore
      - name: Create signing key if missing
        if: env.KS_B64 == '' && steps.ks.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -keystore app/sehati.keystore -storetype PKCS12
          -alias sehati -keyalg RSA -keysize 2048 -validity 10000
          -storepass "$KS_PASS" -keypass "$KS_PASS"
          -dname "CN=Sehati, O=Sehati, C=SY"
      - name: Write google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GS" > app/google-services.json
      - run: gradle assembleDebug
      - name: Export signing key as text (one time)
        if: env.KS_B64 == ''
        continue-on-error: true
        run: base64 -w0 app/sehati.keystore > keystore-b64.txt
      - name: Upload signing key text (one time)
        if: env.KS_B64 == ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: keystore-b64
          path: keystore-b64.txt
          archive: false
      - name: Prepare direct APK
        continue-on-error: true
        run: cp app/build/outputs/apk/debug/*.apk sehati.apk
      - name: Upload direct APK (no zip)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sehati-apk-direct
          path: sehati.apk
          archive: false
      - uses: actions/upload-artifact@v4
        with:
          name: sehati-apk
          path: app/build/outputs/apk/debug/*.apk
