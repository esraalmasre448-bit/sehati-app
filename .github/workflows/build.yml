name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KS_PASS: ${{ secrets.KS_PASS }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KS_B64: ${{ secrets.KEYSTORE_B64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove resource files with invalid names
        shell: bash
        run: |
          if [ -d app/src/main/res ]; then
            find app/src/main/res -type f -name '[0-9]*' -print -delete
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify signing secrets exist
        shell: bash
        env:
          SECRET_CHECK: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$SECRET_CHECK" ]; then
            echo "::error::Secret KS_PASS is missing."
            exit 1
          fi

          if [ -z "$KS_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 is missing."
            exit 1
          fi

      - name: Restore signing key from secret
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KS_B64" | base64 --decode > app/sehati.keystore

          if [ ! -s app/sehati.keystore ]; then
            echo "::error::Restored keystore is empty."
            exit 1
          fi

          echo "Keystore file restored. Contents will not be printed."

      - name: Diagnose signing keystore
        shell: bash
        run: |
          set -u

          if keytool -list \
            -keystore app/sehati.keystore \
            -storepass "$KS_PASS" \
            > /tmp/keystore-check.txt 2>&1; then

            echo "Keystore opened successfully."

            if grep -Eq 'Alias name: sehati|sehati,' /tmp/keystore-check.txt; then
              echo "Expected alias sehati was found."
            else
              echo "::error::The keystore opened, but alias sehati was not found."
              echo "Alias names are not printed for security."
              rm -f /tmp/keystore-check.txt
              exit 1
            fi

          else
            echo "::error::Keystore could not be opened with KS_PASS."
            echo "Check the secret value, keystore integrity, and file format."
            rm -f /tmp/keystore-check.txt
            exit 1
          fi

          rm -f /tmp/keystore-check.txt

      - name: Validate and write google-services.json
        shell: bash
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          raw = os.environ.get("GS", "")

          if not raw.strip():
              print("::error::Secret GOOGLE_SERVICES_JSON is missing.")
              sys.exit(1)

          try:
              data = json.loads(raw)
          except Exception:
              print("::error::GOOGLE_SERVICES_JSON is not valid JSON.")
              sys.exit(1)

          packages = [
              client.get("client_info", {})
                    .get("android_client_info", {})
                    .get("package_name")
              for client in data.get("client", [])
          ]

          if "com.sehati.app" not in packages:
              print(
                  "::error::GOOGLE_SERVICES_JSON does not contain "
                  "package com.sehati.app."
              )
              sys.exit(1)

          with open(
              "app/google-services.json",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(raw)

          print("google-services.json validated successfully.")
          PYEOF

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK was not generated."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner was not found; certificate verification skipped."
            exit 0
          fi

          "$APKSIGNER" verify --print-certs "$APK" \
            | grep "SHA-256 digest" \
            || {
              echo "::error::APK certificate verification failed."
              exit 1
            }

      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: |
          rm -f app/sehati.keystore /tmp/keystore-check.txt

      - name: Prepare direct APK
        if: success()
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sehati.apk

      - name: Upload direct APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sehati-apk-direct
          path: sehati.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sehati-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
