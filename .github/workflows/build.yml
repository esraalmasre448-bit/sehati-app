name: Build APK
on: workflow_dispatch
env:
  KS_PASS: sehatiKeystore2026
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: app/sehati.keystore
          key: sehati-keystore-v1
      - name: Create signing key if missing
        if: steps.ks.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -keystore app/sehati.keystore -storetype PKCS12
          -alias sehati -keyalg RSA -keysize 2048 -validity 10000
          -storepass "$KS_PASS" -keypass "$KS_PASS"
          -dname "CN=Sehati, O=Sehati, C=SY"
      - name: Write google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GS" > app/google-services.json
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sehati-apk
          path: app/build/outputs/apk/debug/*.apk
