name: Deploy Firebase Functions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sa = os.environ.get("FIREBASE_SERVICE_ACCOUNT_JSON", "")
          gs = os.environ.get("GOOGLE_SERVICES_JSON", "")
          if not sa.strip():
              print("::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON")
              sys.exit(1)
          if not gs.strip():
              print("::error::Missing repository secret GOOGLE_SERVICES_JSON")
              sys.exit(1)
          try:
              service = json.loads(sa)
              google = json.loads(gs)
          except Exception:
              print("::error::Firebase credential JSON is invalid")
              sys.exit(1)
          project = google.get("project_info", {}).get("project_id", "")
          if not project or service.get("project_id") != project:
              print("::error::Service account project does not match GOOGLE_SERVICES_JSON")
              sys.exit(1)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("FIREBASE_PROJECT_ID=" + project + "\n")
          with open(os.environ["RUNNER_TEMP"] + "/firebase-service-account.json", "w") as f:
              json.dump(service, f)
          print("Firebase project and service account validated")
          PY
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
