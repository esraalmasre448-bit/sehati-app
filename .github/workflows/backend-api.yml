name: Backend API checks

on:
  push:
    branches:
      - backend/self-hosted-core
    paths:
      - "backend/api/**"
      - ".github/workflows/backend-api.yml"
  pull_request:
    paths:
      - "backend/api/**"
      - ".github/workflows/backend-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sehati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sehati_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Apply all PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sehati_test
          PGPASSWORD: postgres
        run: |
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          DECLARE
            required_table TEXT;
            required_tables TEXT[] := ARRAY[
              'users', 'patient_profiles', 'doctor_profiles', 'clinic_profiles',
              'email_verification_codes', 'auth_rate_limits', 'auth_sessions',
              'password_reset_codes'
            ];
          BEGIN
            FOREACH required_table IN ARRAY required_tables LOOP
              IF to_regclass('public.' || required_table) IS NULL THEN
                RAISE EXCEPTION 'Required migration table is missing: %', required_table;
              END IF;
            END LOOP;

            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname = 'public'
                AND indexname = 'users_email_lower_unique'
                AND indexdef ILIKE '%UNIQUE%'
            ) THEN
              RAISE EXCEPTION 'Case-insensitive unique email index is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'auth_sessions'
                AND column_name = 'replaced_by_session_id'
            ) THEN
              RAISE EXCEPTION 'Refresh-session rotation column is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'password_reset_codes'
                AND column_name = 'attempts'
            ) THEN
              RAISE EXCEPTION 'Password-reset attempt counter is missing';
            END IF;
          END $;
          SQL
