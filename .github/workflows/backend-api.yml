name: Backend API checks

on:
  push:
    branches:
      - backend/self-hosted-core
    paths:
      - "backend/api/**"
      - ".github/workflows/backend-api.yml"
  pull_request:
    paths:
      - "backend/api/**"
      - ".github/workflows/backend-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
